<!DOCTYPE html>
<html>
<head>
  <title>Fake Link Analyzer</title>
</head>
<body>
  <h1>Fake Link Analyzer</h1>
  <textarea id="input" rows="5" cols="40" placeholder="Paste a message or link"></textarea>
  <br>
  <button onclick="check()">Check</button>
  <p id="result" style="white-space: pre-line;"></p>

  <script>
    async function check() {
      const text = document.getElementById("input").value;
      const response = await fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      const data = await response.json();
      let out = "Verdict: " + data.verdict;
      if (data.links.length > 0) {
        out += "\nLinks found: " + data.links.map((l) => l.url).join(", ");
      }
      if (data.reasons.length > 0) {
        out += "\nWhy:\n- " + data.reasons.join("\n- ");
      }
      document.getElementById("result").innerText = out;
    }
  </script>
</body>
</html>
